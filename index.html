<script>
require([
"geoscene/Map",
"geoscene/views/MapView",
"geoscene/Graphic",
"geoscene/layers/GraphicsLayer",
"geoscene/layers/WebTileLayer",
"geoscene/Basemap",
"geoscene/geometry/Point",
"geoscene/geometry/Polyline",
"geoscene/symbols/SimpleMarkerSymbol",
"geoscene/symbols/SimpleLineSymbol",
"geoscene/symbols/TextSymbol",
"geoscene/symbols/PictureMarkerSymbol",
"geoscene/Color",
"geoscene/geometry/support/geodesicUtils",
"geoscene/geometry/support/spatialReferenceUtils"
], function(
Map, MapView, Graphic, GraphicsLayer, WebTileLayer, Basemap, Point, Polyline,
SimpleMarkerSymbol, SimpleLineSymbol, TextSymbol, PictureMarkerSymbol,
Color, geodesicUtils, spatialReferenceUtils
) {
 
const poets = [
{ name: "崔颢",   lng: 114.35, lat: 34.80, color: "#27ae60", poem: "昔人已乘黄鹤去，此地空余黄鹤楼" },
{ name: "李白",   lng: 103.75, lat: 29.23, color: "#e74c3c", poem: "故人西辞黄鹤楼，烟花三月下扬州" },
{ name: "李白",   lng: 113.68, lat: 31.26, color: "#e74c3c", poem: "黄鹤楼中吹玉笛，江城五月落梅花" },
{ name: "陆游",   lng: 120.58, lat: 30.03, color: "#f39c12", poem: "苍龙阙角归何晚，黄鹤楼中醉不知" },
{ name: "范成大", lng: 104.07, lat: 30.57, color: "#9b59b6", poem: "谁将玉笛传新曲，黄鹤楼前共月明" },
{ name: "岳飞",   lng: 112.15, lat: 32.01, color: "#3498db", poem: "何日请缨提锐旅，一鞭直渡清河洛" }
];
 
const hhl = { name: "黄鹤楼", lng: 114.296944, lat: 30.546944 };
 
const map = new Map({
basemap: (function() {
try {
var cdn = "https://{subDomain}.tile.openstreetmap.org/{level}/{col}/{row}.png";
var subs = ["a","b","c"];
var tileLyr = new WebTileLayer({
urlTemplate: cdn,
subDomains: subs,
copyright: "© OpenStreetMap contributors"
});
return new Basemap({ baseLayers: [tileLyr] });
} catch(e) {
return "gray-vector";
}
})()
basemap: "tianditu-vector"
});
 
const view = new MapView({
container: "viewDiv",
map: map,
center: [112, 31.5],
zoom: 5,
constraints: {
minZoom: 4,
maxZoom: 12
},
ui: {
components: ["zoom", "compass"]
}
});
 
const poetLayer = new GraphicsLayer({ title: "诗人点位" });
const lineLayer = new GraphicsLayer({ title: "路径线条" });
const flowLayer = new GraphicsLayer({ title: "流动箭头" });
const hhlLayer  = new GraphicsLayer({ title: "黄鹤楼" });
 
try {
map.layers.addMany([lineLayer, poetLayer, flowLayer, hhlLayer]);
} catch(e) {
map.add(lineLayer);
map.add(poetLayer);
map.add(flowLayer);
map.add(hhlLayer);
}
 
function createBezierCurve(start, end, curvature = 0.25, segments = 120) {
const dx = end[0] - start[0];
const dy = end[1] - start[1];
const dist = Math.sqrt(dx * dx + dy * dy);
const mx = (start[0] + end[0]) / 2;
const my = (start[1] + end[1]) / 2;
const nx = -dy / dist;
const ny =  dx / dist;
const offset = dist * curvature;
const cx = mx + nx * offset;
const cy = my + ny * offset;
const pts = [];
for (let i = 0; i <= segments; i++) {
const t = i / segments;
const x = (1-t)*(1-t)*start[0] + 2*(1-t)*t*cx + t*t*end[0];
const y = (1-t)*(1-t)*start[1] + 2*(1-t)*t*cy + t*t*end[1];
pts.push([x, y]);
}
return pts;
}
 
function interpolateOnCurve(points, t) {
const n = points.length - 1;
const exact = t * n;
const idx = Math.min(Math.floor(exact), n - 1);
const frac = exact - idx;
const p0 = points[idx];
const p1 = points[idx + 1];
return [
p0[0] + (p1[0] - p0[0]) * frac,
p0[1] + (p1[1] - p0[1]) * frac
];
}
 
const routes = [];
 
function initMap() {
poets.forEach((poet, idx) => {
const poetPoint = new Point({
longitude: poet.lng,
latitude: poet.lat
});
const poetSymbol = new SimpleMarkerSymbol({
color: poet.color,
size: 12,
outline: { color: [255, 255, 255, 0.9], width: 2 }
});
const poetAttr = { name: poet.name, poem: poet.poem };
const poetGraphic = new Graphic({
geometry: poetPoint,
symbol: poetSymbol,
attributes: poetAttr,
popupTemplate: {
title: "诗人：{name}",
content: "<b>出发地坐标：</b>[" + poet.lng + ", " + poet.lat + "]<br><b>与黄鹤楼相关诗句：</b><br><i>「{poem}」</i>"
}
});
poetLayer.add(poetGraphic);
 
const labelSymbol = new TextSymbol({
text: poet.name,
color: poet.color,
haloColor: "rgba(255,255,255,0.9)",
haloSize: 1.5,
font: { size: 14, weight: "bold", family: "Microsoft YaHei" },
yoffset: 18
});
poetLayer.add(new Graphic({ geometry: poetPoint, symbol: labelSymbol }));
 
const curvePoints = createBezierCurve(
[poet.lng, poet.lat],
[hhl.lng, hhl.lat],
0.18 + (idx % 3) * 0.06
);
const lineColor = new Color(poet.color);
lineColor.a = 0.35;
const baseLine = new Polyline({ paths: [curvePoints] });
const baseSymbol = new SimpleLineSymbol({
color: lineColor,
width: 2,
style: "dash"
});
lineLayer.add(new Graphic({ geometry: baseLine, symbol: baseSymbol }));
 
const brightColor = new Color(poet.color);
brightColor.a = 0.9;
const headSymbol = new SimpleLineSymbol({
color: brightColor,
width: 4
});
 
routes.push({
poet: poet,
curvePoints: curvePoints,
headGraphic: null,
headSymbol: headSymbol,
tailGraphics: [],
progress: Math.random() * 0.3,
speed: 0.0018 + Math.random() * 0.0012
});
});
 
const hhlPoint = new Point({ longitude: hhl.lng, latitude: hhl.lat });
const hhlSymbol = new SimpleMarkerSymbol({
color: "#ffd700",
size: 22,
outline: { color: "#ff6b6b", width: 3.5 }
});
const hhlGraphic = new Graphic({
geometry: hhlPoint,
symbol: hhlSymbol,
attributes: { name: "黄鹤楼", addr: "湖北省武汉市武昌区蛇山之巅" },
popupTemplate: {
title: "🏯 {name}",
content: "<b>位置：</b>{addr}<br><b>经纬度：</b>[" + hhl.lng.toFixed(4) + ", " + hhl.lat.toFixed(4) + "]<br><br><b>历代诗人在此留下无数千古名篇</b>"
}
});
hhlLayer.add(hhlGraphic);
 
const hhlLabel = new TextSymbol({
text: "黄鹤楼",
color: "#ffd700",
haloColor: "rgba(0,0,0,0.8)",
haloSize: 2,
font: { size: 17, weight: "bold", family: "Microsoft YaHei" },
yoffset: 28
});
hhlLayer.add(new Graphic({ geometry: hhlPoint, symbol: hhlLabel }));
 
const starSymbol = new TextSymbol({
text: "★",
color: "#ff6b6b",
font: { size: 14 },
yoffset: 52
});
hhlLayer.add(new Graphic({ geometry: hhlPoint, symbol: starSymbol }));
}
 
let animHandle = null;
let isPlaying = false;
 
function updateFlow() {
routes.forEach(route => {
if (route.headGraphic) {
flowLayer.remove(route.headGraphic);
}
route.tailGraphics.forEach(g => flowLayer.remove(g));
route.tailGraphics = [];
 
const t = route.progress;
const tailLen = 0.06;
const tailStart = Math.max(0, t - tailLen);
 
if (t - tailStart > 0.001) {
const segs = 14;
for (let s = 0; s < segs; s++) {
const st = tailStart + (t - tailStart) * (s / segs);
const et = tailStart + (t - tailStart) * ((s + 1) / segs);
const segStart = interpolateOnCurve(route.curvePoints, st);
const segEnd   = interpolateOnCurve(route.curvePoints, et);
const alpha = 0.15 + (s / segs) * 0.75;
const w = 1.5 + (s / segs) * 4.5;
const c = new Color(route.poet.color);
c.a = alpha;
route.tailGraphics.push(new Graphic({
geometry: new Polyline({ paths: [[segStart, segEnd]] }),
symbol: new SimpleLineSymbol({ color: c, width: w })
}));
}
route.tailGraphics.forEach(g => flowLayer.add(g));
}
 
const headPos = interpolateOnCurve(route.curvePoints, t);
const prevPos = interpolateOnCurve(route.curvePoints, Math.max(0, t - 0.004));
const angle = Math.atan2(headPos[1] - prevPos[1], headPos[0] - prevPos[0]) * 180 / Math.PI;
 
const arrowSvg =
'<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">' +
'<defs><filter id="glow"><feGaussianBlur stdDeviation="1.5" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
'<polygon points="30,16 8,4 12,16 8,28" fill="' + route.poet.color + '" stroke="white" stroke-width="1.5" filter="url(#glow)"/>' +
'</svg>';
const arrowSymbol = new PictureMarkerSymbol({
url: "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(arrowSvg))),
width: "30px",
height: "30px",
angle: -angle
});
route.headGraphic = new Graphic({
geometry: new Point({ longitude: headPos[0], latitude: headPos[1] }),
symbol: arrowSymbol
});
flowLayer.add(route.headGraphic);
 
route.progress += route.speed;
if (route.progress > 1) {
route.progress = 0;
}
});
}
 
function startAnim() {
if (isPlaying) return;
isPlaying = true;
document.getElementById("btnPlay").classList.add("active");
document.getElementById("btnPause").classList.remove("active");
function tick() {
updateFlow();
animHandle = requestAnimationFrame(tick);
}
tick();
}
 
function pauseAnim() {
isPlaying = false;
document.getElementById("btnPause").classList.add("active");
document.getElementById("btnPlay").classList.remove("active");
if (animHandle) { cancelAnimationFrame(animHandle); animHandle = null; }
}
 
function resetAnim() {
pauseAnim();
routes.forEach(r => r.progress = Math.random() * 0.3);
flowLayer.removeAll();
}
 
function makeTileBasemap(config) {
try {
var layer = new WebTileLayer({
urlTemplate: config.url,
subDomains: config.subs || ["a","b","c"],
copyright: config.copy || ""
});
var extras = (config.overlays || []).map(function(ocfg){
return new WebTileLayer({
urlTemplate: ocfg.url,
subDomains: ocfg.subs || ["a","b","c","d"],
copyright: ocfg.copy || ""
});
});
return new Basemap({ baseLayers: [layer].concat(extras) });
} catch(e) {
return null;
}
}
 
var TILE_PRESETS = {
"streets-vector": {
url: "https://{subDomain}.tile.openstreetmap.org/{level}/{col}/{row}.png",
subs: ["a","b","c"],
copy: "© OpenStreetMap contributors"
},
"topo-vector": {
url: "https://{subDomain}.tile.opentopomap.org/{level}/{col}/{row}.png",
subs: ["a","b","c"],
copy: "© OpenTopoMap (CC-BY-SA)"
},
"satellite": {
url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{level}/{row}/{col}",
subs: [],
copy: "© Esri World Imagery"
},
"hybrid": {
url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{level}/{row}/{col}",
subs: [],
copy: "© Esri World Imagery + CARTO Labels",
overlays: [{
url: "https://{subDomain}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{level}/{col}/{row}{@2x}.png",
subs: ["a","b","c","d"]
}]
},
"dark-gray-vector": {
url: "https://{subDomain}.basemaps.cartocdn.com/dark_all/{level}/{col}/{row}{@2x}.png",
subs: ["a","b","c","d"],
copy: "© CARTO Dark Matter"
},
"gray-vector": {
url: "https://{subDomain}.basemaps.cartocdn.com/light_all/{level}/{col}/{row}{@2x}.png",
subs: ["a","b","c","d"],
copy: "© CARTO Voyager Light"
}
var FALLBACK_BASEMAP = "tianditu-vector";
var OFFICIAL_GEOSCENE_BASEMAPS = {
"tianditu-vector": true,
"tianditu-topography": true,
"tianditu-image": true,
"geoscene-blue": true,
"geoscene-community": true,
"geoscene-gray": true,
"geoscene-warm": true
};
 
function switchBasemap(basemapId, btnEl) {
document.querySelectorAll(".basemap-btn").forEach(b => b.classList.remove("active"));
if (btnEl) btnEl.classList.add("active");
if (basemapId === "transparent") {
try { map.basemap = null; } catch(e){}
try { document.body.classList.add("transparent-mode"); } catch(e){}
try {
var s = document.querySelector(".esri-view-surface");
if (s) s.style.background = "transparent";
} catch(e){}
return;
}
try { document.body.classList.remove("transparent-mode"); } catch(e){}
try {
var s = document.querySelector(".esri-view-surface");
if (s) s.style.background = "";
} catch(e){}
try {
var cfg = TILE_PRESETS[basemapId];
if (cfg) {
var bm = makeTileBasemap(cfg);
if (bm) { map.basemap = bm; return; }
if (!OFFICIAL_GEOSCENE_BASEMAPS[basemapId]) {
basemapId = FALLBACK_BASEMAP;
}
map.basemap = "gray-vector";
map.basemap = basemapId;
} catch(err) {
try {
map.basemap = makeTileBasemap(TILE_PRESETS["streets-vector"]);
} catch(e){}
try { map.basemap = FALLBACK_BASEMAP; } catch(e){}
}
}
 
view.when(function() {
initMap();
setTimeout(startAnim, 600);
 
document.getElementById("btnPlay").onclick  = startAnim;
document.getElementById("btnPause").onclick = pauseAnim;
document.getElementById("btnReset").onclick = resetAnim;
 
document.querySelectorAll(".basemap-btn").forEach(btn => {
btn.onclick = function() {
switchBasemap(btn.getAttribute("data-basemap"), btn);
};
});
});
});
</script>
</body>
</html>
