<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>古代诗人前往黄鹤楼 - 流动箭头动画</title>
  <link rel="stylesheet" href="https://js.geoscene.cn/4.28/geoscene/themes/dark/main.css" />
  <style>
    html, body, #viewDiv { padding:0; margin:0; height:100%; width:100%; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    #title-panel { position:absolute; top:15px; left:50%; transform:translateX(-50%); z-index:99; background:rgba(20,30,48,0.88); color:#ffd700; padding:10px 28px; border-radius:8px; border:1px solid rgba(255,215,0,0.4); font-size:17px; font-weight:bold; letter-spacing:2px; box-shadow:0 4px 15px rgba(0,0,0,0.3); pointer-events:none; }
    #legend-panel { position:absolute; bottom:20px; left:20px; z-index:99; background:rgba(20,30,48,0.88); color:#fff; padding:14px 18px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,0.3); max-width:250px; }
    #legend-panel h4 { margin:0 0 10px 0; color:#ffd700; font-size:14px; border-bottom:1px solid rgba(255,215,0,0.3); padding-bottom:6px; }
    .legend-item { display:flex; align-items:center; margin:6px 0; }
    .legend-color { width:16px; height:16px; border-radius:50%; margin-right:10px; flex-shrink:0; }
    .legend-line { width:30px; height:3px; margin-right:10px; border-radius:2px; flex-shrink:0; }
    #control-panel { position:absolute; top:70px; right:20px; z-index:99; background:rgba(20,30,48,0.88); color:#fff; padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
    #control-panel .panel-title { margin-bottom:8px; color:#ffd700; font-weight:bold; }
    #control-panel button { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; border:none; padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; margin:3px; transition:all .3s; }
    #control-panel button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(102,126,234,0.4); }
    #control-panel button.active { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); }
    #basemap-panel { position:absolute; top:70px; left:20px; z-index:99; background:rgba(20,30,48,0.88); color:#fff; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,0.3); max-width:190px; }
    #basemap-panel h4 { margin:0 0 10px 0; color:#ffd700; font-size:13px; border-bottom:1px solid rgba(255,215,0,0.3); padding-bottom:6px; }
    .basemap-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
    .basemap-btn { position:relative; width:100%; height:40px; border:2px solid rgba(255,255,255,0.25); border-radius:6px; cursor:pointer; overflow:hidden; transition:all .25s; padding:0; }
    .basemap-btn:hover { transform:scale(1.04); box-shadow:0 3px 10px rgba(255,215,0,0.3); }
    .basemap-btn.active { border-color:#ffd700; box-shadow:0 0 0 2px rgba(255,215,0,0.35); }
    .basemap-btn .bm-preview { width:100%; height:100%; display:block; }
    .basemap-btn .bm-label { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,0.65); color:#fff; font-size:11px; padding:2px 0; text-align:center; line-height:1.2; }
    .bm-streets { background:linear-gradient(135deg,#e8f2d9 0%,#b7d4a3 50%,#f4e4c1 100%); }
    .bm-topo    { background:linear-gradient(135deg,#d9e4b5 0%,#9db56f 40%,#c8a36a 100%); border-top:2px dashed #a77; }
    .bm-sat     { background:linear-gradient(135deg,#1a3e4f 0%,#2e5d4f 40%,#4d3d2f 100%); }
    .bm-comm    { background:linear-gradient(135deg,#e6d5b8 0%,#a3b5c9 50%,#b8a3c9 100%); }
    .bm-gray    { background:linear-gradient(135deg,#eaeaea 0%,#f5f5f5 50%,#dedede 100%); }
    .bm-warm    { background:linear-gradient(135deg,#f5e6d3 0%,#e8c9a3 50%,#c9a078 100%); }
    .bm-transparent { background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#e0e0e0 6px,#e0e0e0 12px); }
  </style>
  <script src="https://js.geoscene.cn/4.28/"></script>
</head>
<body>
  <div id="viewDiv"></div>
  <div id="title-panel">古代诗人赴黄鹤楼之旅</div>

  <div id="basemap-panel">
    <h4>底图切换</h4>
    <div class="basemap-grid">
      <button class="basemap-btn active" data-bm="tianditu-vector" title="天地图街道（推荐）">
        <div class="bm-preview bm-streets"></div><div class="bm-label">天地图街道</div>
      </button>
      <button class="basemap-btn" data-bm="tianditu-topography" title="天地图地形">
        <div class="bm-preview bm-topo"></div><div class="bm-label">天地图地形</div>
      </button>
      <button class="basemap-btn" data-bm="tianditu-image" title="天地图影像">
        <div class="bm-preview bm-sat"></div><div class="bm-label">天地图影像</div>
      </button>
      <button class="basemap-btn" data-bm="geoscene-community" title="社区街道">
        <div class="bm-preview bm-comm"></div><div class="bm-label">社区街道</div>
      </button>
      <button class="basemap-btn" data-bm="geoscene-gray" title="浅灰简约">
        <div class="bm-preview bm-gray"></div><div class="bm-label">浅灰简约</div>
      </button>
      <button class="basemap-btn" data-bm="geoscene-warm" title="暖色古风">
        <div class="bm-preview bm-warm"></div><div class="bm-label">暖色古风</div>
      </button>
    </div>
    <div style="margin-top:8px;">
      <button class="basemap-btn" data-bm="transparent" title="仅箭头（透明）" style="width:100%;height:36px;">
        <div class="bm-preview bm-transparent"></div><div class="bm-label">仅箭头（透明）</div>
      </button>
    </div>
  </div>

  <div id="control-panel">
    <div class="panel-title">动画控制</div>
    <button id="btnPlay" class="active">播放</button>
    <button id="btnPause">暂停</button>
    <button id="btnReset">重置</button>
  </div>

  <div id="legend-panel">
    <h4>诗人与目的地</h4>
    <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div><span>李白（2处起点）</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#3498db;"></div><span>岳飞</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#27ae60;"></div><span>崔颢</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#9b59b6;"></div><span>范成大</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#f39c12;"></div><span>陆游</span></div>
    <div style="height:1px;background:rgba(255,255,255,0.15);margin:10px 0;"></div>
    <div class="legend-item"><div class="legend-color" style="background:#ffd700;border:2px solid #ff6b6b;"></div><span>黄鹤楼（终点）</span></div>
    <div class="legend-item"><div class="legend-line" style="background:linear-gradient(90deg,#ff6b6b,#ffd700);"></div><span>流动路径（箭头）</span></div>
  </div>

  <script>
  require([
    "geoscene/Map",
    "geoscene/views/MapView",
    "geoscene/Graphic",
    "geoscene/layers/GraphicsLayer",
    "geoscene/geometry/Point",
    "geoscene/geometry/Polyline",
    "geoscene/symbols/SimpleMarkerSymbol",
    "geoscene/symbols/SimpleLineSymbol",
    "geoscene/symbols/TextSymbol",
    "geoscene/symbols/PictureMarkerSymbol",
    "geoscene/Color"
  ], function (
    Map, MapView, Graphic, GraphicsLayer, Point, Polyline,
    SimpleMarkerSymbol, SimpleLineSymbol, TextSymbol, PictureMarkerSymbol, Color
  ) {
    "use strict";

    var poets = [
      { name: "崔颢",   lng: 114.35, lat: 34.80, color: "#27ae60", poem: "昔人已乘黄鹤去，此地空余黄鹤楼" },
      { name: "李白",   lng: 103.75, lat: 29.23, color: "#e74c3c", poem: "故人西辞黄鹤楼，烟花三月下扬州" },
      { name: "李白",   lng: 113.68, lat: 31.26, color: "#e74c3c", poem: "黄鹤楼中吹玉笛，江城五月落梅花" },
      { name: "陆游",   lng: 120.58, lat: 30.03, color: "#f39c12", poem: "苍龙阙角归何晚，黄鹤楼中醉不知" },
      { name: "范成大", lng: 104.07, lat: 30.57, color: "#9b59b6", poem: "谁将玉笛传新曲，黄鹤楼前共月明" },
      { name: "岳飞",   lng: 112.15, lat: 32.01, color: "#3498db", poem: "何日请缨提锐旅，一鞭直渡清河洛" }
    ];
    var hhl = { name: "黄鹤楼", lng: 114.296944, lat: 30.546944 };

    var OFFICIAL_BM = {
      "tianditu-vector": 1,
      "tianditu-topography": 1,
      "tianditu-image": 1,
      "geoscene-blue": 1,
      "geoscene-community": 1,
      "geoscene-gray": 1,
      "geoscene-warm": 1
    };
    var FALLBACK_BM = "tianditu-vector";

    var map = new Map({ basemap: FALLBACK_BM });
    var view = new MapView({
      container: "viewDiv",
      map: map,
      center: [112, 31.5],
      zoom: 5,
      constraints: { minZoom: 4, maxZoom: 12 },
      ui: { components: ["zoom", "compass"] }
    });

    var poetLayer = new GraphicsLayer({ title: "诗人点位" });
    var lineLayer = new GraphicsLayer({ title: "路径线条" });
    var flowLayer = new GraphicsLayer({ title: "流动箭头" });
    var hhlLayer  = new GraphicsLayer({ title: "黄鹤楼" });

    try {
      map.add(lineLayer);
      map.add(poetLayer);
      map.add(flowLayer);
      map.add(hhlLayer);
    } catch (e1) {
      try {
        map.layers.add(lineLayer);
        map.layers.add(poetLayer);
        map.layers.add(flowLayer);
        map.layers.add(hhlLayer);
      } catch (e2) {}
    }

    function bezier(start, end, curv, seg) {
      curv = curv || 0.25; seg = seg || 120;
      var dx = end[0] - start[0], dy = end[1] - start[1];
      var dist = Math.sqrt(dx * dx + dy * dy);
      var mx = (start[0] + end[0]) / 2, my = (start[1] + end[1]) / 2;
      var nx = -dy / dist, ny = dx / dist;
      var off = dist * curv;
      var cx = mx + nx * off, cy = my + ny * off;
      var pts = [], i, t;
      for (i = 0; i <= seg; i++) {
        t = i / seg;
        pts.push([
          (1 - t) * (1 - t) * start[0] + 2 * (1 - t) * t * cx + t * t * end[0],
          (1 - t) * (1 - t) * start[1] + 2 * (1 - t) * t * cy + t * t * end[1]
        ]);
      }
      return pts;
    }
    function lerpOn(pts, t) {
      var n = pts.length - 1;
      var ex = t * n;
      var idx = Math.min(Math.floor(ex), n - 1);
      var f = ex - idx;
      var p0 = pts[idx], p1 = pts[idx + 1];
      return [p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f];
    }

    var routes = [];

    function initMap() {
      poets.forEach(function (poet, idx) {
        var pp = new Point({ longitude: poet.lng, latitude: poet.lat });
        var psym = new SimpleMarkerSymbol({
          color: poet.color, size: 12,
          outline: { color: [255, 255, 255, 0.9], width: 2 }
        });
        var pAttr = { name: poet.name, poem: poet.poem };
        var pPopup = {
          title: "诗人：{name}",
          content: "<b>出发地坐标：</b>[" + poet.lng + ", " + poet.lat +
                   "]<br/><b>与黄鹤楼相关诗句：</b><br/><i>「{poem}」</i>"
        };
        poetLayer.add(new Graphic({ geometry: pp, symbol: psym, attributes: pAttr, popupTemplate: pPopup }));

        poetLayer.add(new Graphic({
          geometry: pp,
          symbol: new TextSymbol({
            text: poet.name, color: poet.color,
            haloColor: "rgba(255,255,255,0.9)", haloSize: 1.5,
            font: { size: 14, weight: "bold", family: "Microsoft YaHei" },
            yoffset: 18
          })
        }));

        var curve = bezier([poet.lng, poet.lat], [hhl.lng, hhl.lat], 0.18 + (idx % 3) * 0.06);
        var lineC = new Color(poet.color); lineC.a = 0.35;
        lineLayer.add(new Graphic({
          geometry: new Polyline({ paths: [curve] }),
          symbol: new SimpleLineSymbol({ color: lineC, width: 2, style: "dash" })
        }));

        routes.push({
          poet: poet,
          curve: curve,
          head: null,
          tails: [],
          progress: Math.random() * 0.3,
          speed: 0.0018 + Math.random() * 0.0012
        });
      });

      var hp = new Point({ longitude: hhl.lng, latitude: hhl.lat });
      var hSym = new SimpleMarkerSymbol({
        color: "#ffd700", size: 22,
        outline: { color: "#ff6b6b", width: 3.5 }
      });
      var hAttr = { name: "黄鹤楼", addr: "湖北省武汉市武昌区蛇山之巅" };
      var hPopup = {
        title: "黄鹤楼",
        content: "<b>位置：</b>" + hAttr.addr +
                 "<br/><b>经纬度：</b>[" + hhl.lng.toFixed(4) + ", " + hhl.lat.toFixed(4) + "]"
      };
      hhlLayer.add(new Graphic({ geometry: hp, symbol: hSym, attributes: hAttr, popupTemplate: hPopup }));

      hhlLayer.add(new Graphic({
        geometry: hp,
        symbol: new TextSymbol({
          text: "黄鹤楼", color: "#ffd700",
          haloColor: "rgba(0,0,0,0.8)", haloSize: 2,
          font: { size: 17, weight: "bold", family: "Microsoft YaHei" },
          yoffset: 28
        })
      }));
      hhlLayer.add(new Graphic({
        geometry: hp,
        symbol: new TextSymbol({
          text: "★", color: "#ff6b6b", font: { size: 14 }, yoffset: 52
        })
      }));
    }

    var animHandle = null;
    var isPlaying = false;

    function arrowSvg(color) {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">' +
        '<defs><filter id="g"><feGaussianBlur stdDeviation="1.2"/></filter></defs>' +
        '<polygon points="30,16 8,4 12,16 8,28" fill="' + color +
        '" stroke="#fff" stroke-width="1.5" filter="url(#g)"/></svg>';
    }

    function updateFlow() {
      var i, route, t, tailStart, segs, s, st, et, segA, segB, alpha, w, c;
      var headPos, prevPos, angle, svg, sym;
      for (i = 0; i < routes.length; i++) {
        route = routes[i];
        if (route.head) { try { flowLayer.remove(route.head); } catch (e) {} }
        route.tails.forEach(function (g) { try { flowLayer.remove(g); } catch (e) {} });
        route.tails = [];

        t = route.progress;
        tailStart = Math.max(0, t - 0.06);
        if (t - tailStart > 0.001) {
          segs = 14;
          for (s = 0; s < segs; s++) {
            st = tailStart + (t - tailStart) * (s / segs);
            et = tailStart + (t - tailStart) * ((s + 1) / segs);
            segA = lerpOn(route.curve, st);
            segB = lerpOn(route.curve, et);
            alpha = 0.15 + (s / segs) * 0.75;
            w = 1.5 + (s / segs) * 4.5;
            c = new Color(route.poet.color);
            c.a = alpha;
            route.tails.push(new Graphic({
              geometry: new Polyline({ paths: [[segA, segB]] }),
              symbol: new SimpleLineSymbol({ color: c, width: w })
            }));
          }
          route.tails.forEach(function (g) { flowLayer.add(g); });
        }

        headPos = lerpOn(route.curve, t);
        prevPos = lerpOn(route.curve, Math.max(0, t - 0.004));
        angle = Math.atan2(headPos[1] - prevPos[1], headPos[0] - prevPos[0]) * 180 / Math.PI;
        svg = arrowSvg(route.poet.color);
        try {
          sym = new PictureMarkerSymbol({
            url: "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg))),
            width: "30px", height: "30px", angle: -angle
          });
        } catch (e) {
          sym = new SimpleMarkerSymbol({
            color: route.poet.color, size: 12,
            outline: { color: "#fff", width: 1.5 }
          });
        }
        route.head = new Graphic({
          geometry: new Point({ longitude: headPos[0], latitude: headPos[1] }),
          symbol: sym
        });
        flowLayer.add(route.head);

        route.progress += route.speed;
        if (route.progress > 1) route.progress = 0;
      }
    }
    function startAnim() {
      if (isPlaying) return;
      isPlaying = true;
      try { document.getElementById("btnPlay").classList.add("active"); } catch (e) {}
      try { document.getElementById("btnPause").classList.remove("active"); } catch (e) {}
      (function tick() { updateFlow(); animHandle = requestAnimationFrame(tick); })();
    }
    function pauseAnim() {
      isPlaying = false;
      try { document.getElementById("btnPause").classList.add("active"); } catch (e) {}
      try { document.getElementById("btnPlay").classList.remove("active"); } catch (e) {}
      if (animHandle) { try { cancelAnimationFrame(animHandle); } catch (e) {} animHandle = null; }
    }
    function resetAnim() {
      pauseAnim();
      routes.forEach(function (r) { r.progress = Math.random() * 0.3; });
      try { flowLayer.removeAll(); } catch (e) {}
    }

    function switchBM(id, btn) {
      try {
        document.querySelectorAll(".basemap-btn").forEach(function (b) { b.classList.remove("active"); });
      } catch (e) {}
      if (btn) { try { btn.classList.add("active"); } catch (e) {} }
      if (id === "transparent") {
        try { map.basemap = null; } catch (e) {}
        try { document.body.classList.add("transparent-mode"); } catch (e) {}
        try {
          var surf = document.querySelector(".esri-view-surface");
          if (surf) surf.style.background = "transparent";
        } catch (e) {}
        return;
      }
      try { document.body.classList.remove("transparent-mode"); } catch (e) {}
      try {
        var surf = document.querySelector(".esri-view-surface");
        if (surf) surf.style.background = "";
      } catch (e) {}
      if (!OFFICIAL_BM[id]) id = FALLBACK_BM;
      try { map.basemap = id; } catch (e) {
        try { map.basemap = FALLBACK_BM; } catch (e2) {}
      }
    }

    view.when(function () {
      initMap();
      setTimeout(startAnim, 500);
      try {
        document.getElementById("btnPlay").onclick  = startAnim;
        document.getElementById("btnPause").onclick = pauseAnim;
        document.getElementById("btnReset").onclick = resetAnim;
        document.querySelectorAll(".basemap-btn").forEach(function (btn) {
          btn.onclick = function () { switchBM(btn.getAttribute("data-bm"), btn); };
        });
      } catch (e) {}
    });
  });
  </script>
</body>
</html>
