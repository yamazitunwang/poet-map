<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>古代诗人登黄鹤楼时间轴 - 流动箭头动画</title>
  <link rel="stylesheet" href="https://js.geoscene.cn/4.28/geoscene/themes/dark/main.css" />
  <style>
    html, body, #viewDiv { padding:0; margin:0; height:100%; width:100%; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
    #title-panel { position:absolute; top:15px; left:50%; transform:translateX(-50%); z-index:99; background:rgba(20,30,48,0.88); color:#ffd700; padding:10px 28px; border-radius:8px; border:1px solid rgba(255,215,0,0.4); font-size:17px; font-weight:bold; letter-spacing:2px; box-shadow:0 4px 15px rgba(0,0,0,0.3); pointer-events:none; }
    #time-info-panel { position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:99; background:rgba(20,30,48,0.92); color:#fff; padding:10px 22px; border-radius:8px; border:1px solid rgba(255,215,0,0.3); font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.3); min-width:320px; text-align:center; }
    #time-info-panel .era-label { color:#ffd700; font-weight:bold; font-size:16px; letter-spacing:1px; }
    #time-info-panel .year-label { color:#74b9ff; font-size:13px; margin-left:8px; }
    #time-info-panel .poet-count { color:#55efc4; font-size:13px; margin-left:8px; }
    #legend-panel { position:absolute; top:180px; left:20px; z-index:99; background:rgba(20,30,48,0.88); color:#fff; padding:14px 18px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,0.3); max-width:260px; }
    #legend-panel h4 { margin:0 0 10px 0; color:#ffd700; font-size:14px; border-bottom:1px solid rgba(255,215,0,0.3); padding-bottom:6px; }
    .legend-item { display:flex; align-items:center; margin:6px 0; }
    .legend-color { width:16px; height:16px; border-radius:50%; margin-right:10px; flex-shrink:0; }
    .legend-line { width:30px; height:3px; margin-right:10px; border-radius:2px; flex-shrink:0; }
    .legend-era { font-size:11px; color:#aaa; margin-left:6px; }
    #control-panel { position:absolute; top:70px; right:20px; z-index:99; background:rgba(20,30,48,0.88); color:#fff; padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,0.3); }
    #control-panel .panel-title { margin-bottom:8px; color:#ffd700; font-weight:bold; }
    #control-panel button { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; border:none; padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; margin:3px; transition:all .3s; }
    #control-panel button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(102,126,234,0.4); }
    #control-panel button.active { background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%); }
    #basemap-panel { position:absolute; top:180px; right:20px; z-index:99; background:rgba(20,30,48,0.88); color:#fff; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,0.3); max-width:190px; }
    #basemap-panel h4 { margin:0 0 10px 0; color:#ffd700; font-size:13px; border-bottom:1px solid rgba(255,215,0,0.3); padding-bottom:6px; }
    .basemap-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
    .basemap-btn { position:relative; width:100%; height:40px; border:2px solid rgba(255,255,255,0.25); border-radius:6px; cursor:pointer; overflow:hidden; transition:all .25s; padding:0; }
    .basemap-btn:hover { transform:scale(1.04); box-shadow:0 3px 10px rgba(255,215,0,0.3); }
    .basemap-btn.active { border-color:#ffd700; box-shadow:0 0 0 2px rgba(255,215,0,0.35); }
    .basemap-btn .bm-preview { width:100%; height:100%; display:block; }
    .basemap-btn .bm-label { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,0.65); color:#fff; font-size:11px; padding:2px 0; text-align:center; line-height:1.2; }
    .bm-streets { background:linear-gradient(135deg,#e8f2d9 0%,#b7d4a3 50%,#f4e4c1 100%); }
    .bm-topo    { background:linear-gradient(135deg,#d9e4b5 0%,#9db56f 40%,#c8a36a 100%); border-top:2px dashed #a77; }
    .bm-sat     { background:linear-gradient(135deg,#1a3e4f 0%,#2e5d4f 40%,#4d3d2f 100%); }
    .bm-comm    { background:linear-gradient(135deg,#e6d5b8 0%,#a3b5c9 50%,#b8a3c9 100%); }
    .bm-gray    { background:linear-gradient(135deg,#eaeaea 0%,#f5f5f5 50%,#dedede 100%); }
    .bm-warm    { background:linear-gradient(135deg,#f5e6d3 0%,#e8c9a3 50%,#c9a078 100%); }
    .bm-transparent { background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#e0e0e0 6px,#e0e0e0 12px); }

    /* ===== 时间轴样式 ===== */
    #timeline-container {
      position:absolute;
      bottom:25px;
      left:50%;
      transform:translateX(-50%);
      z-index:99;
      width:88%;
      max-width:1100px;
      background:rgba(20,30,48,0.92);
      border:1px solid rgba(255,215,0,0.35);
      border-radius:12px;
      padding:18px 26px 14px 26px;
      box-shadow:0 6px 22px rgba(0,0,0,0.45);
    }
    #timeline-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }
    #timeline-title {
      color:#ffd700;
      font-weight:bold;
      font-size:14px;
      letter-spacing:1px;
    }
    #timeline-controls {
      display:flex;
      align-items:center;
      gap:8px;
    }
    #timeline-controls button {
      background:linear-gradient(135deg,#00b894 0%,#00cec9 100%);
      color:#fff;
      border:none;
      padding:5px 14px;
      border-radius:5px;
      cursor:pointer;
      font-size:12px;
      transition:all .25s;
    }
    #timeline-controls button:hover {
      transform:translateY(-1px);
      box-shadow:0 3px 10px rgba(0,184,148,0.45);
    }
    #timeline-controls button.active {
      background:linear-gradient(135deg,#e17055 0%,#d63031 100%);
    }
    #timeline-controls #btnSpeedToggle {
      background:linear-gradient(135deg,#fdcb6e 0%,#e17055 100%);
      min-width:54px;
    }
    #slider-wrap {
      position:relative;
      padding:24px 0 10px 0;
    }
    #era-track {
      position:absolute;
      left:0; right:0;
      top:32px;
      height:10px;
      display:flex;
      border-radius:5px;
      overflow:hidden;
    }
    .era-seg {
      height:100%;
      position:relative;
    }
    .era-seg.tang   { background:linear-gradient(90deg,#e74c3c,#e67e22); }
    .era-seg.song   { background:linear-gradient(90deg,#3498db,#9b59b6); }
    .era-label-track {
      position:absolute;
      left:0; right:0;
      top:8px;
      display:flex;
      font-size:11px;
      color:#ddd;
    }
    .era-label-track .era-text {
      position:relative;
      text-align:center;
      font-weight:bold;
    }
    .era-label-track .era-text.tang-text { color:#ff7675; }
    .era-label-track .era-text.song-text { color:#74b9ff; }

    #timeline-slider {
      -webkit-appearance:none;
      appearance:none;
      width:100%;
      height:10px;
      background:transparent;
      cursor:pointer;
      outline:none;
      position:relative;
      z-index:3;
    }
    #timeline-slider::-webkit-slider-runnable-track {
      height:10px;
      background:rgba(255,255,255,0.08);
      border-radius:5px;
    }
    #timeline-slider::-moz-range-track {
      height:10px;
      background:rgba(255,255,255,0.08);
      border-radius:5px;
    }
    #timeline-slider::-webkit-slider-thumb {
      -webkit-appearance:none;
      appearance:none;
      width:22px;
      height:22px;
      margin-top:-6px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#ffeaa7,#fdcb6e,#e17055);
      border:2px solid #fff;
      box-shadow:0 0 0 4px rgba(253,203,110,0.25), 0 3px 10px rgba(0,0,0,0.5);
      cursor:grab;
      transition:transform .15s;
    }
    #timeline-slider::-webkit-slider-thumb:hover {
      transform:scale(1.12);
    }
    #timeline-slider::-webkit-slider-thumb:active {
      cursor:grabbing;
    }
    #timeline-slider::-moz-range-thumb {
      width:22px;
      height:22px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#ffeaa7,#fdcb6e,#e17055);
      border:2px solid #fff;
      box-shadow:0 0 0 4px rgba(253,203,110,0.25), 0 3px 10px rgba(0,0,0,0.5);
      cursor:grab;
    }
    #poet-markers {
      position:absolute;
      left:0; right:0;
      top:30px;
      height:14px;
      pointer-events:none;
      z-index:2;
    }
    .poet-marker {
      position:absolute;
      top:0;
      width:3px;
      height:14px;
      border-radius:2px;
      transform:translateX(-50%);
      box-shadow:0 0 5px rgba(255,255,255,0.5);
      cursor:pointer;
      pointer-events:auto;
    }
    .poet-marker::after {
      content:attr(data-name);
      position:absolute;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      font-size:10px;
      color:#fff;
      white-space:nowrap;
      background:rgba(0,0,0,0.6);
      padding:2px 5px;
      border-radius:3px;
      opacity:0;
      transition:opacity .2s;
    }
    .poet-marker:hover::after {
      opacity:1;
    }
    .poet-marker.active {
      height:18px;
      box-shadow:0 0 8px #ffd700;
    }
    #year-ticks {
      display:flex;
      justify-content:space-between;
      margin-top:6px;
      font-size:11px;
      color:#aaa;
    }
    #year-ticks span {
      position:relative;
    }
    #year-ticks span::before {
      content:"";
      position:absolute;
      top:-4px;
      left:50%;
      width:1px;
      height:4px;
      background:#666;
    }
    #active-poets-list {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:10px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,0.15);
      min-height:28px;
    }
    .poet-tag {
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 10px;
      border-radius:14px;
      font-size:12px;
      color:#fff;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      animation:fadeIn .3s ease-out;
    }
    .poet-tag .dot {
      width:8px;
      height:8px;
      border-radius:50%;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(4px); }
      to   { opacity:1; transform:translateY(0); }
    }
    #error-panel {
      position: absolute; z-index: 9999; top: 10px; right: 10px; max-width: 360px;
      padding: 10px 14px; border-radius: 8px; background: rgba(176, 20, 20, 0.95);
      color: #fff; font-size: 12px; line-height: 1.5; display: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4); border: 1px solid #ff6b6b;
    }
    #error-panel h4 { margin: 0 0 6px 0; font-size: 13px; color: #ffd700; }
    #error-panel pre { margin: 0; padding: 6px 8px; background: rgba(0,0,0,0.25); border-radius: 4px; font-size: 11px; overflow-x: auto; }
    #error-panel .err-close { float: right; cursor: pointer; padding: 0 4px; color: #fff; font-weight: bold; }
    #loading-panel {
      position: absolute; z-index: 5; top: 50%; left: 50%;
      transform: translate(-50%, -50%); background: rgba(10, 20, 40, 0.92);
      padding: 18px 28px; border-radius: 10px; color: #fff;
      font-size: 14px; text-align: center; border: 1px solid rgba(255,215,0,0.4);
    }
    #loading-panel .spinner {
      display: inline-block; width: 22px; height: 22px; margin-right: 10px; vertical-align: middle;
      border: 3px solid rgba(255,215,0,0.25); border-top-color: #ffd700; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // ===== 启动前配置 + 全局错误捕获 =====
    window.__PHHL_ERRS__ = [];
    window.__showError = function (title, msg) {
      try {
        var box = document.getElementById("error-panel");
        if (!box) return;
        box.style.display = "block";
        var html = '<span class="err-close" onclick="document.getElementById(\'error-panel\').style.display=\'none\'">×</span>' +
                   '<h4>⚠ ' + (title || '错误') + '</h4>' +
                   '<div style="margin-bottom:6px;">地图未能加载。请：① 检查网络是否能访问 js.geoscene.cn；② 刷新页面重试；③ 如部署到服务器需 HTTPS。</div>' +
                   '<pre>' + (msg || '') + '</pre>';
        box.innerHTML = html;
      } catch (e) {}
    };
    window.addEventListener('error', function (ev) {
      var info = (ev.message || '') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || '') + ':' + (ev.colno || '');
      window.__PHHL_ERRS__.push(info);
    });
    window.addEventListener('unhandledrejection', function (ev) {
      window.__PHHL_ERRS__.push('Promise: ' + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason)));
    });

    // ===== GeoScene JS API 防御性加载 =====
    // dojoConfig 必须放在 API script 之前，官方启动模式
    window.dojoConfig = {
      async: true,
      has: { "esri-featurelayer-webscene-layerlist": 0 },
      tlmSiblingOfDojo: false
    };
    (function loadAPI() {
      var API_URL = "https://js.geoscene.cn/4.28/";
      // 防止API被加载两次
      if (window.__GEOSCENE_API_LOADING__ || window.__GEOSCENE_API_LOADED__) return;
      window.__GEOSCENE_API_LOADING__ = true;
      var s = document.createElement("script");
      s.src = API_URL;
      s.charset = "utf-8";
      s.onload = function () { window.__GEOSCENE_API_LOADED__ = true; };
      s.onerror = function () {
        window.__showError("底图API加载失败", "无法加载 GeoScene JS API: " + API_URL + "\n请检查网络连接或更换部署环境。");
      };
      // 插到head末尾，避免和其他script顺序冲突
      document.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="error-panel"></div>
  <div id="loading-panel"><span class="spinner"></span>正在加载地图与诗人数据...</div>
  <div id="viewDiv" style="position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;z-index:0;"></div>
  <div id="title-panel">历代诗人登黄鹤楼时间轴</div>

  <div id="time-info-panel">
    <span class="era-label" id="currentEra">—</span>
    <span class="year-label" id="currentYear">正在加载...</span>
    <span class="poet-count" id="poetCount"></span>
  </div>

  <div id="basemap-panel">
    <h4>底图切换</h4>
    <div class="basemap-grid">
      <button class="basemap-btn active" data-bm="tianditu-vector" title="天地图街道（推荐）">
        <div class="bm-preview bm-streets"></div><div class="bm-label">天地图街道</div>
      </button>
      <button class="basemap-btn" data-bm="tianditu-topography" title="天地图地形">
        <div class="bm-preview bm-topo"></div><div class="bm-label">天地图地形</div>
      </button>
      <button class="basemap-btn" data-bm="tianditu-image" title="天地图影像">
        <div class="bm-preview bm-sat"></div><div class="bm-label">天地图影像</div>
      </button>
      <button class="basemap-btn" data-bm="geoscene-community" title="社区街道">
        <div class="bm-preview bm-comm"></div><div class="bm-label">社区街道</div>
      </button>
      <button class="basemap-btn" data-bm="geoscene-gray" title="浅灰简约">
        <div class="bm-preview bm-gray"></div><div class="bm-label">浅灰简约</div>
      </button>
      <button class="basemap-btn" data-bm="geoscene-warm" title="暖色古风">
        <div class="bm-preview bm-warm"></div><div class="bm-label">暖色古风</div>
      </button>
    </div>
    <div style="margin-top:8px;">
      <button class="basemap-btn" data-bm="transparent" title="仅箭头（透明）" style="width:100%;height:36px;">
        <div class="bm-preview bm-transparent"></div><div class="bm-label">仅箭头（透明）</div>
      </button>
    </div>
  </div>

  <div id="control-panel">
    <div class="panel-title">动画控制</div>
    <button id="btnPlay" class="active">播放</button>
    <button id="btnPause">暂停</button>
    <button id="btnReset">重置</button>
  </div>

  <div id="legend-panel">
    <h4>诗人与目的地</h4>
    <div id="poetLegend"></div>
    <div style="height:1px;background:rgba(255,255,255,0.15);margin:10px 0;"></div>
    <div class="legend-item"><div class="legend-color" style="background:#ffd700;border:2px solid #ff6b6b;"></div><span>黄鹤楼（终点）</span></div>
    <div class="legend-item"><div class="legend-line" style="background:linear-gradient(90deg,#ff6b6b,#ffd700);"></div><span>流动路径（箭头）</span></div>
  </div>

  <!-- 时间轴 -->
  <div id="timeline-container">
    <div id="timeline-header">
      <div id="timeline-title">⏳ 登楼时间轴（拖动滑块查看各时代诗人）</div>
      <div id="timeline-controls">
        <button id="btnAutoPlay">▶ 自动播放</button>
        <button id="btnSpeedToggle" title="切换播放速度">1x</button>
      </div>
    </div>
    <div id="slider-wrap">
      <div class="era-label-track" id="eraLabelTrack"></div>
      <div id="era-track"></div>
      <div id="poet-markers"></div>
      <input type="range" id="timeline-slider" min="0" max="1000" value="0" step="1" />
    </div>
    <div id="year-ticks"></div>
    <div id="active-poets-list"><span style="color:#888;font-size:12px;">← 拖动上方滑块，查看不同时代的诗人依次登场</span></div>
  </div>

  <script>
  // ============================================================
  // Phase A：纯 UI（时间轴 / 图例 / 状态），完全不依赖 geoscene 模块
  // 页面一加载立即执行，即便地图加载失败也能看到时间轴与错误信息
  // ============================================================
  (function () {
    "use strict";
    window.__PHHL_UI__ = {};
    var S = window.__PHHL_UI__;

    S.YEAR_MIN = 700; S.YEAR_MAX = 1200;
    S.ERAS = [
      { name: "唐朝",   start: 618,  end: 907,  cls: "tang", textCls: "tang-text" },
      { name: "五代",   start: 907,  end: 960,  cls: "tang", textCls: "tang-text" },
      { name: "北宋",   start: 960,  end: 1127, cls: "song", textCls: "song-text" },
      { name: "南宋",   start: 1127, end: 1279, cls: "song", textCls: "song-text" }
    ];
    S.poets = [
      { name: "崔颢",   lng: 114.35, lat: 34.80, color: "#27ae60", year: 730, era: "盛唐", poem: "昔人已乘黄鹤去，此地空余黄鹤楼", id: "cuihao" },
      { name: "李白",   lng: 103.75, lat: 29.23, color: "#e74c3c", year: 735, era: "盛唐", poem: "故人西辞黄鹤楼，烟花三月下扬州", id: "libai1" },
      { name: "李白",   lng: 113.68, lat: 31.26, color: "#e74c3c", year: 760, era: "盛唐", poem: "黄鹤楼中吹玉笛，江城五月落梅花", id: "libai2" },
      { name: "岳飞",   lng: 112.15, lat: 32.01, color: "#3498db", year: 1134, era: "南宋", poem: "何日请缨提锐旅，一鞭直渡清河洛", id: "yuefei" },
      { name: "范成大", lng: 104.07, lat: 30.57, color: "#9b59b6", year: 1170, era: "南宋", poem: "谁将玉笛传新曲，黄鹤楼前共月明", id: "fanchengda" },
      { name: "陆游",   lng: 120.58, lat: 30.03, color: "#f39c12", year: 1179, era: "南宋", poem: "苍龙阙角归何晚，黄鹤楼中醉不知", id: "luyou" }
    ];
    S.poets.sort(function (a, b) { return a.year - b.year; });

    S.hhl = { name: "黄鹤楼", lng: 114.296944, lat: 30.546944 };
    S.OFFICIAL_BM = {
      "tianditu-vector": 1, "tianditu-topography": 1, "tianditu-image": 1,
      "geoscene-blue": 1, "geoscene-community": 1, "geoscene-gray": 1, "geoscene-warm": 1
    };
    S.FALLBACK_BM = "tianditu-vector";

    S.activeIdx = [];
    S.autoPlaying = false; S.autoPlayHandle = null; S.playSpeed = 1;
    S.speedLevels = [1, 2, 4]; S.speedIndex = 0;

              document.getElementById("btnPlay").onclick  = startAnim;
              document.getElementById("btnPause").onclick = pauseAnim;
              document.getElementById("btnReset").onclick = resetAnim;
            } catch (e) {}

            // —— 6. 正式创建 Map / MapView / 图层
            try {
              map = new Map({ basemap: FALLBACK_BM });
            } catch (eMap1) {
              window.__showError("Map 构造失败", collectErrDetail("new Map() 抛出异常：" + (eMap1 && eMap1.message ? eMap1.message : String(eMap1))));
              hideLoading(); return;
            }
            try {
              view = new MapView({
                container: "viewDiv", map: map,
                center: [112, 31.5], zoom: 5,
                constraints: { minZoom: 4, maxZoom: 12 },
                ui: { components: ["zoom", "compass"] }
              });
            } catch (eMV) {
              window.__showError("MapView 构造失败", collectErrDetail("new MapView() 抛出异常：" + (eMV && eMV.message ? eMV.message : String(eMV))));
              hideLoading(); return;
            }
            poetLayer = new GraphicsLayer({ title: "诗人点位" });
            lineLayer = new GraphicsLayer({ title: "路径线条" });
            flowLayer = new GraphicsLayer({ title: "流动箭头" });
            hhlLayer  = new GraphicsLayer({ title: "黄鹤楼" });
            try {
              map.add(lineLayer); map.add(poetLayer); map.add(flowLayer); map.add(hhlLayer);
            } catch (e1) {
              try {
                map.layers.add(lineLayer); map.layers.add(poetLayer);
                map.layers.add(flowLayer); map.layers.add(hhlLayer);
              } catch (e2) {}
            }

            view.when(function () {
              try { initMapGraphics(); } catch (eM) {
                window.__PHHL_ERRS__.push("initMapGraphics: " + (eM && eM.message ? eM.message : String(eM)));
              }
              mapReady = true;
              try {
                var snap = [], t;
                for (t = 0; t < activeIdx.length; t++) snap.push(activeIdx[t]);
                var u;
                for (u = 0; u < poets.length; u++) setOnePoetActive(u, false);
                var v;
                for (v = 0; v < snap.length; v++) setOnePoetActive(snap[v], true);
              } catch (eSync) {}
              setTimeout(startAnim, 500);
              try {
                var defaultBtn = document.querySelector('.basemap-btn[data-bm="' + FALLBACK_BM + '"]');
                if (defaultBtn) defaultBtn.classList.add("active");
              } catch (e) {}
              hideLoading();

              // 重新触发一次滑块联动，确保UI与地图完全同步
              try {
                var curSlider = document.getElementById("timeline-slider");
                if (curSlider) {
                  var pct = parseInt(curSlider.value, 10) / 1000;
                  var yr = S.pctToYear(pct);
                  updateActiveByYear(yr);
                }
              } catch (e) {}
            }, function (viewErr) {
              var errMsg = (viewErr && viewErr.message) ? viewErr.message : String(viewErr);
              var extra = "";
              if (errMsg.indexOf("WebGL") !== -1) {
                extra = "\n\n💡 说明：当前浏览器/环境禁用了硬件加速（WebGL不可用）。\n您平时使用的Edge/Chrome/360等主流桌面浏览器均支持WebGL，不会出现此问题。\n可尝试：① 打开浏览器硬件加速设置（chrome://settings/system → 启用硬件加速）；② 更换电脑或浏览器访问。";
              }
              window.__showError("地图渲染失败",
                collectErrDetail("view.when reject: " + errMsg + extra));
              hideLoading();
            });

          } catch (eCb) {
            window.__showError("地图初始化异常", collectErrDetail("回调内部异常：" + (eCb && eCb.message ? eCb.message : String(eCb))));
            hideLoading();
          }
        }, function (reqErr) {
          // AMD require errback：模块加载失败会走这里
          window.__showError("require 模块加载失败", collectErrDetail("require errback: " + (reqErr && reqErr.message ? reqErr.message : String(reqErr)) +
            "\n这通常是 multipleDefine 或 API script 加载不完全导致。建议：刷新页面 / 清除缓存 / 换独立页面打开。"));
          hideLoading();
        });
      } catch (eReq) {
        window.__showError("require 调用异常", collectErrDetail("try window.require 抛出: " + (eReq && eReq.message ? eReq.message : String(eReq))));
        hideLoading();
      }
    }

    function poll() {
      if (typeof window.require === "function") {
        // 确认 dojo/require 的 AMD 能力可用（检查能定义 hasCache），再延迟 200ms 给内部 init
        setTimeout(startMapInit, 250);
        return;
      }
      if (Date.now() - startTs > MAX_WAIT) {
        window.__showError("地图API加载超时", collectErrDetail("在 " + (MAX_WAIT / 1000) + " 秒内未等到 window.require。\n请检查网络：能否打开 https://js.geoscene.cn/4.28/"));
        hideLoading();
        return;
      }
      setTimeout(poll, 200);
    }

    // DOMContentLoaded 后再开始轮询，确保错误面板 DOM 已就绪
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", poll);
    } else {
      poll();
    }
  })();
  </script>
</body>
</html>
